name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis
            targets: ""
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OMNISTORE_GOOGLE_CLIENT_ID: ${{ secrets.OMNISTORE_GOOGLE_CLIENT_ID }}
          OMNISTORE_GOOGLE_CLIENT_SECRET: ${{ secrets.OMNISTORE_GOOGLE_CLIENT_SECRET }}
        with:
          tagName: v__VERSION__
          releaseName: OmniStore v__VERSION__
          releaseBody: |
            **Download:** [Windows](https://github.com/Aristotlev/omnistore/releases/latest/download/OmniStore-Windows.exe) · [Mac](https://github.com/Aristotlev/omnistore/releases/latest/download/OmniStore-Mac.dmg)

            Windows 10/11: run OmniStore-Windows.exe. If you see "Windows protected your PC", click More info, then Run anyway.
            Mac (macOS 11+, Apple silicon and Intel): open OmniStore-Mac.dmg and drag OmniStore to Applications. If macOS can't verify the developer, open System Settings → Privacy & Security and click Open Anyway.

            Already installed? OmniStore updates itself.
          releaseDraft: false
          prerelease: false
          retryAttempts: 3
          args: ${{ matrix.args }}
      # Same file under a name that never changes, so download links always point at the latest version.
      - name: Attach fixed-name download
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$RUNNER_OS" = "Windows" ]; then
            SRC=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -n1)
            NAME=OmniStore-Windows.exe
          else
            SRC=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -n1)
            NAME=OmniStore-Mac.dmg
          fi
          cp "$SRC" "$NAME"
          gh release upload "v$VERSION" "$NAME" --clobber -R "${{ github.repository }}"
