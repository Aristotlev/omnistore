[package]
name = "omnistore"
version = "0.1.0"
description = "OmniStore: one dashboard for every cloud plan, device and drive"
authors = ["Aristotle"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows (cargo#8519)
name = "omnistore_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time", "macros", "rt-multi-thread", "sync"] }
# native-tls = SChannel on Windows, Security.framework on macOS/iOS (no C toolchain needed)
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "multipart"] }
sysinfo = { version = "0.37", default-features = false, features = ["disk", "system"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
walkdir = "2"
plist = "1"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
urlencoding = "2"
anyhow = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
