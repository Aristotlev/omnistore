[package]
name = "omnistore"
version = "0.1.0"
description = "OmniStore: one dashboard for every cloud plan, device and drive"
authors = ["Aristotle"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows (cargo#8519)
name = "omnistore_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.37", default-features = false, features = ["disk", "system"] }
walkdir = "2"
plist = "1"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
# Google sign-in (system browser + PKCE). native-tls = SChannel on Windows, Security.framework on Apple.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
tokio = { version = "1", features = ["net", "io-util", "time"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
# iPhone / iPad over USB or Wi-Fi through Apple's device service (same channel Apple Devices / Finder use)
idevice = { version = "0.1.68", default-features = false, features = ["ring", "usbmuxd", "installation_proxy", "afc"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_Foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
